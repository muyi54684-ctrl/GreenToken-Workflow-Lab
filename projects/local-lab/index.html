<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GreenToken · 本地分镜实验台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script defer src="viewer.js"></script><script defer src="lab.js"></script></head><body>
<main><header><b>GreenToken <span>/ Script2Video</span></b><nav><a href="#new">新建实验</a><a href="#library">实验记录</a><a href="#comparison">分镜与用量</a></nav><strong id="mode">正在连接本机</strong></header>
<h1>分镜实验台</h1><p class="intro">用同一份分镜初稿比较 Baseline、low 和跳过审核后的画面内容、Token 与耗时。</p>
<section class="card" id="new"><div class="row"><h2>生成分镜</h2><span class="model">deepseek-v4-pro</span></div>
<label for="script">剧本</label><textarea id="script" rows="5" maxlength="12000" placeholder="写下人物、场景、动作，以及需要保留的对白。"></textarea>
<div class="row"><label>对白语言 <select id="language"><option value="zh-CN">中文</option><option value="en-US">英语</option></select></label><button id="generate" disabled>生成新初稿</button></div>
<small id="hint"></small><a id="live-entry" href="http://127.0.0.1:4181/#new" hidden>打开真实调用模式 ↗</a></section>
<section id="library" class="library"><div><h2>实验记录</h2><label>选择要看的案例 <select id="history"><option value="archive">雨夜校园 · 历史实测</option></select></label></div><a href="/showcase/index.html">雨夜校园完整讲解 ↗</a></section>
<p id="status" role="status" aria-live="polite"></p>
<section class="card" id="session" hidden><div class="row"><h2>当前实验</h2><small id="stamp"></small></div><p id="source"></p><p id="generation-info"></p><ol id="draft"></ol><button id="freeze">冻结这份初稿</button>
<div id="controls" hidden><h3>选择对照组</h3><div class="choices"><label><input type="checkbox" data-group="baseline"> Baseline · 原始审核</label><label><input type="checkbox" data-group="low"> low · 低思考强度</label><label><input type="checkbox" data-group="skip"> Skip · 直接定稿</label></div><div class="actions"><button id="run-selected">运行所选策略</button><small id="request-count"></small></div><p id="runs"></p></div>
</section><div id="comparison"></div><section class="export" hidden id="export"><h2>面试回放</h2><p>文件包含本次剧本、分镜、对白与资源摘要。保存后用浏览器直接打开。</p><a id="download" download>保存独立 HTML 回放 ↓</a></section>
</main></body></html>
